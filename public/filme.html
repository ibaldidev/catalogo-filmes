<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filme | Em Cartaz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/cabecalho.js"></script>
  <script type="module" src="js/filme.js"></script>
</head>
<!-- "com-fundo": o cabeçalho fica por cima da imagem grande do topo -->
<body class="com-fundo">
  <header class="cabecalho">
    <a class="marca" href="index.html">Em Cartaz</a>
    <nav class="menu" aria-label="Principal">
      <div class="conta" id="conta"></div>
      <a href="index.html#catalogo">Filmes</a>
    </nav>
    <form class="busca" action="busca.html" role="search">
      <label class="so-leitor" for="campo-busca">Buscar filme</label>
      <input id="campo-busca" name="q" type="search" placeholder="Buscar filme" autocomplete="off">
      <button type="submit">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span class="so-leitor">Buscar</span>
      </button>
    </form>
  </header>

  <main class="pagina-filme" id="filme" aria-live="polite">
    <p class="vazio">Carregando…</p>
  </main>

  <footer class="rodape">
    <div class="rodape-interno">
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">
        <img src="img/tmdb-logo.svg" alt="The Movie Database (TMDB)">
      </a>
      <p>Este produto usa a API do TMDB, mas não é endossado nem certificado pelo TMDB. Dados de streaming: JustWatch.</p>
    </div>
  </footer>
</body>
</html>
